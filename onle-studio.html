<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Onle Studio"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Onle Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F5F5F5;font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;color:#111111}
::-webkit-scrollbar{width:0}
input,select,textarea{-webkit-appearance:none;appearance:none;font-family:inherit}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4}
@keyframes slideUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes barGrow{from{width:0}to{width:var(--w)}}
.page{animation:slideUp .25s cubic-bezier(.22,1,.36,1)}
.pressable:active{opacity:.7;transition:opacity .1s}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid #111;display:inline-block;margin:0 8px;transition:background .15s}
.pin-dot.filled{background:#111}
.pin-btn{width:72px;height:72px;border-radius:50%;border:1.5px solid #E0E0E0;background:#FFFFFF;font-size:22px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#111;transition:background .12s}
.pin-btn:active{background:#F0F0F0}
.pin-sub{font-size:8px;color:#999;letter-spacing:1.5px;margin-top:2px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Palette: White dominant, Black accent ────────────────────────
var C={
  bg:       "#F5F5F5",
  white:    "#FFFFFF",
  black:    "#111111",
  dark:     "#0A0A0A",
  card:     "#FFFFFF",
  cardGray: "#F8F8F8",
  border:   "#EBEBEB",
  borderDk: "#D0D0D0",
  muted:    "#888888",
  mutedLt:  "#BBBBBB",
  accent:   "#111111",
  error:    "#E53935",
};
var F="'Inter',-apple-system,'Helvetica Neue',sans-serif";

var CAT_COLORS=["#111111","#444444","#666666","#888888","#AAAAAA","#333333","#555555","#777777","#222222","#999999","#CCCCCC","#DDDDDD"];

var PAYERS=["Shop","Kathy","Daddy","Hazel"];
var PLATFORMS=["Shopee","Taobao","PDD","1688","Lazada","Grab","Others"];
var DEFAULT_CATS=[
  "Permanent Bracelet",
  "Stainless Steel",
  "Silver",
  "Copper",
  "DIY Charm (Necklace & Bracelet)",
  "Packaging & Boxes",
  "Tools & Equipment",
  "Marketing & Photography",
  "Platform Fees & Ads",
  "Shipping & Postage",
  "Studio Rental",
  "Others",
];
var CURR=["MYR (RM)","RMB (¥)"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function td(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pad(n){return String(n).padStart(2,"0")}
function fRM(n){return"RM "+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function fRMB(n){return"¥"+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function gMYR(e){return e.currency==="RMB (¥)"?(+e.amountMYR||0):(+e.amount||0)}
function ld(k,f){try{var v=localStorage.getItem(k);return v!=null?JSON.parse(v):f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function h(tag,props,kids){
  var e=document.createElement(tag);
  if(props)for(var k in props){
    if(k==="style"&&typeof props[k]==="object"){Object.assign(e.style,props[k])}
    else if(k==="cls"){e.className=props[k]}
    else if(k[0]==="o"&&k[1]==="n"){e.addEventListener(k.slice(2).toLowerCase(),props[k])}
    else e.setAttribute(k,props[k]);
  }
  if(kids!=null){var arr=Array.isArray(kids)?kids:[kids];arr.forEach(function(c){
    if(c==null||c===false||c===undefined)return;
    e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  })}
  return e;
}
function t(s){return document.createTextNode(String(s==null?"":s))}

// ── State ────────────────────────────────────────────────────────
var S={
  unlocked:false,
  pin:ld("onle_pin",""),
  page:"dashboard",
  expenses:ld("onle_expenses",[]),
  categories:ld("onle_cats",DEFAULT_CATS),
  editId:null,
  search:"",fm:"All",fc:"All",fp:"All",fpy:"All",
  toast:null,tTimer:null,
  delTarget:null,
  viewImg:null,
  expandId:null,
  form:null,
  selM:ld("onle_sm",new Date().getMonth()),
  selY:ld("onle_sy",new Date().getFullYear()),
};
function ef(){return{date:td(),description:"",paidBy:"Shop",platform:"Shopee",platformOther:"",category:S.categories[0]||DEFAULT_CATS[0],categoryOther:"",currency:"MYR (RM)",exchangeRate:"1.7104",amount:"",amountMYR:"",notes:"",screenshots:[]}}

var app=document.getElementById("app");
function render(){var n=buildApp();var o=app.firstChild;if(o)app.replaceChild(n,o);else app.appendChild(n)}
function set(patch){Object.assign(S,patch);render()}

var IS={width:"100%",background:C.white,border:"1.5px solid "+C.border,color:C.black,borderRadius:"12px",padding:"13px 14px",fontSize:"14px",outline:"none",fontFamily:F,fontWeight:"400"};

// ════════════════════════════════════════════════════════════════
function buildApp(){
  var w=h("div",{style:{minHeight:"100vh",background:C.bg,color:C.black,fontFamily:F,maxWidth:"480px",margin:"0 auto",position:"relative",overflowX:"hidden"}});
  if(!S.pin){w.appendChild(buildSetPin());return w}
  if(!S.unlocked){w.appendChild(buildPinLock());return w}
  w.appendChild(buildHeader());
  var pw=h("div",{style:{padding:"0 0 110px"}});
  if(S.page==="dashboard")pw.appendChild(buildDash());
  else if(S.page==="add")pw.appendChild(buildAdd());
  else if(S.page==="monthly")pw.appendChild(buildMonthly());
  else if(S.page==="categories")pw.appendChild(buildCats());
  else if(S.page==="export")pw.appendChild(buildExport());
  w.appendChild(pw);
  if(S.page==="dashboard"){
    w.appendChild(buildNav());
    // FAB — black circle, white plus
    w.appendChild(h("button",{cls:"pressable",style:{position:"fixed",bottom:"86px",right:"20px",width:"52px",height:"52px",borderRadius:"50%",background:C.black,border:"none",color:C.white,fontSize:"26px",fontWeight:"300",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:"101",fontFamily:F,boxShadow:"0 4px 16px rgba(0,0,0,.18)"},onclick:function(){set({page:"add",editId:null,form:ef()})}},"+"));
  }
  if(S.toast){w.appendChild(h("div",{style:{position:"fixed",top:"76px",right:"16px",zIndex:"999",background:S.toast.e?C.error:C.black,color:C.white,padding:"11px 18px",borderRadius:"10px",fontWeight:"600",fontSize:"13px",animation:"toastIn .2s ease",boxShadow:"0 4px 20px rgba(0,0,0,.15)",maxWidth:"280px",letterSpacing:"-.1px"}},S.toast.m))}
  if(S.delTarget)w.appendChild(buildDelModal());
  if(S.viewImg){
    var lb=h("div",{style:{position:"fixed",inset:"0",background:"rgba(0,0,0,.88)",zIndex:"300",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",padding:"16px"},onclick:function(){set({viewImg:null})}});
    lb.appendChild(h("img",{src:S.viewImg,style:{maxWidth:"100%",maxHeight:"80vh",borderRadius:"12px",objectFit:"contain"}}));
    lb.appendChild(h("div",{style:{color:"rgba(255,255,255,.5)",marginTop:"14px",fontSize:"13px"}},"Tap to close"));
    w.appendChild(lb);
  }
  return w;
}

// ── PIN ──────────────────────────────────────────────────────────
function buildPinPad(onComplete,titleNode,subNode){
  var entered="";
  var wrap=h("div",{style:{minHeight:"100vh",background:C.white,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}});
  wrap.appendChild(titleNode);wrap.appendChild(subNode);
  var dots=h("div",{style:{display:"flex",justifyContent:"center",marginBottom:"36px"}});
  for(var i=0;i<4;i++)dots.appendChild(h("span",{cls:"pin-dot"}));
  wrap.appendChild(dots);
  var err=h("div",{style:{color:C.error,fontSize:"13px",fontWeight:"500",textAlign:"center",marginTop:"-24px",marginBottom:"18px",minHeight:"18px",letterSpacing:"-.1px"}});
  wrap.appendChild(err);
  function upd(){dots.querySelectorAll(".pin-dot").forEach(function(d,i){i<entered.length?d.classList.add("filled"):d.classList.remove("filled")})}
  var grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:"14px",justifyContent:"center"}});
  [1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(function(n){
    var btn=h("button",{cls:"pin-btn"});
    btn.appendChild(h("span",{},String(n===""?" ":n)));
    var subs={2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"};
    if(subs[n])btn.appendChild(h("span",{cls:"pin-sub"},subs[n]));
    btn.addEventListener("click",function(){
      if(n==="⌫"){entered=entered.slice(0,-1);upd();err.textContent="";return}
      if(n==="")return;if(entered.length>=4)return;
      entered+=String(n);upd();
      if(entered.length===4)onComplete(entered,err,function(){entered="";upd()});
    });
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function buildSetPin(){
  var title=h("div",{style:{textAlign:"center",marginBottom:"40px"}});
  title.appendChild(h("div",{style:{fontSize:"11px",fontWeight:"600",letterSpacing:"3px",textTransform:"uppercase",color:C.muted,marginBottom:"10px"}},"Onle Studio"));
  title.appendChild(h("div",{style:{fontSize:"26px",fontWeight:"700",color:C.black,letterSpacing:"-.5px",marginBottom:"6px"}},"Set Your PIN"));
  var sub=h("div",{style:{color:C.muted,fontSize:"14px",textAlign:"center",marginBottom:"8px",letterSpacing:"-.1px"}},"Choose a 4-digit PIN to protect your app");
  return buildPinPad(function(pin){sv("onle_pin",pin);S.pin=pin;S.unlocked=true;render()},title,sub);
}

function buildPinLock(){
  var title=h("div",{style:{textAlign:"center",marginBottom:"44px"}});
  // logo mark — just text, clean
  var logoMark=h("div",{style:{width:"52px",height:"52px",borderRadius:"14px",background:C.black,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}});
  logoMark.appendChild(h("div",{style:{color:C.white,fontWeight:"700",fontSize:"16px",letterSpacing:"-.5px"}},"O"));
  title.appendChild(logoMark);
  title.appendChild(h("div",{style:{fontSize:"20px",fontWeight:"700",color:C.black,letterSpacing:"-.5px"}},"Onle Studio"));
  title.appendChild(h("div",{style:{fontSize:"13px",color:C.muted,marginTop:"4px",letterSpacing:"-.1px"}},"Business Expense Manager"));
  var sub=h("div",{style:{marginBottom:"8px"}});
  var pw=buildPinPad(function(pin,err,reset){
    if(pin===S.pin){S.unlocked=true;render()}
    else{err.textContent="Incorrect PIN. Try again.";reset()}
  },title,sub);
  var rw=h("div",{style:{textAlign:"center",marginTop:"32px"}});
  rw.appendChild(h("button",{style:{background:"none",border:"none",color:C.muted,fontSize:"12px",cursor:"pointer",fontFamily:F,textDecoration:"underline",letterSpacing:"-.1px"},onclick:function(){if(confirm("Reset PIN?")){sv("onle_pin","");S.pin="";render()}}},"Forgot PIN? Reset"));
  pw.appendChild(rw);
  return pw;
}

// ── HEADER ───────────────────────────────────────────────────────
function buildHeader(){
  var hd=h("header",{style:{padding:"18px 20px 0",position:"sticky",top:"0",zIndex:"50",background:C.white+"EE",backdropFilter:"blur(16px)",borderBottom:"1px solid "+C.border}});
  var row=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",paddingBottom:"16px"}});
  var tl=h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}});
  var logoBox=h("div",{style:{width:"32px",height:"32px",borderRadius:"8px",background:C.black,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:"0"}});
  logoBox.appendChild(h("div",{style:{color:C.white,fontWeight:"700",fontSize:"13px",letterSpacing:"-.3px"}},"O"));
  tl.appendChild(logoBox);
  var nameWrap=h("div");
  nameWrap.appendChild(h("div",{style:{fontSize:"15px",fontWeight:"700",color:C.black,letterSpacing:"-.4px",lineHeight:"1.1"}},"Onle Studio"));
  nameWrap.appendChild(h("div",{style:{fontSize:"10px",color:C.muted,letterSpacing:"-.1px",marginTop:"1px"}},"Expense Manager"));
  tl.appendChild(nameWrap);
  row.appendChild(tl);
  if(S.page!=="dashboard"){
    row.appendChild(h("button",{cls:"pressable",style:{background:C.bg,border:"1px solid "+C.border,color:C.muted,borderRadius:"8px",padding:"7px 14px",fontSize:"13px",cursor:"pointer",fontFamily:F,fontWeight:"500",letterSpacing:"-.2px"},onclick:function(){set({page:"dashboard",editId:null,form:null})}},"Back"));
  } else {
    row.appendChild(h("button",{cls:"pressable",style:{background:"none",border:"none",color:C.muted,fontSize:"13px",cursor:"pointer",fontFamily:F,fontWeight:"500",letterSpacing:"-.2px"},onclick:function(){S.unlocked=false;render()}},"Lock"));
  }
  hd.appendChild(row);
  return hd;
}

function buildNav(){
  var nav=h("nav",{style:{position:"fixed",bottom:"0",left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"480px",background:C.white+"F8",backdropFilter:"blur(20px)",borderTop:"1px solid "+C.border,display:"flex",alignItems:"center",justifyContent:"space-around",padding:"10px 0 max(10px,env(safe-area-inset-bottom))",zIndex:"100"}});
  [["monthly","Monthly"],["categories","Categories"],["export","Export"]].forEach(function(item){
    var btn=h("button",{cls:"pressable",style:{background:"none",border:"none",color:C.muted,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",fontSize:"10px",cursor:"pointer",fontFamily:F,fontWeight:"600",letterSpacing:"-.1px",padding:"4px 20px",textTransform:"uppercase"},onclick:function(){set({page:item[0]})}});
    btn.appendChild(t(item[1]));nav.appendChild(btn);
  });
  return nav;
}

// ── DASHBOARD ────────────────────────────────────────────────────
function getFiltered(){
  return S.expenses.filter(function(e){
    var m=parseInt((e.date||"").split("-")[1]);
    if(S.fm!=="All"&&(m-1)!==MON.indexOf(S.fm))return false;
    if(S.fc!=="All"&&e.category!==S.fc)return false;
    if(S.fp!=="All"&&e.platform!==S.fp)return false;
    if(S.fpy!=="All"&&e.paidBy!==S.fpy)return false;
    if(S.search&&(e.description||"").toLowerCase().indexOf(S.search.toLowerCase())<0&&(e.notes||"").toLowerCase().indexOf(S.search.toLowerCase())<0)return false;
    return true;
  });
}

function buildDash(){
  var fil=getFiltered();
  var tot=fil.reduce(function(s,e){return s+gMYR(e)},0);
  var w=h("div",{cls:"page",style:{padding:"0 0 0"}});

  // Black hero card (like the reference image)
  var hero=h("div",{style:{margin:"16px 16px 0",background:C.black,borderRadius:"20px",padding:"22px 20px",position:"relative",overflow:"hidden"}});
  hero.appendChild(h("div",{style:{fontSize:"12px",fontWeight:"500",color:"rgba(255,255,255,.5)",letterSpacing:"-.1px",marginBottom:"6px"}},"Total Expenses"));
  hero.appendChild(h("div",{style:{fontSize:"36px",fontWeight:"700",color:C.white,letterSpacing:"-1px",lineHeight:"1",marginBottom:"20px"}},fRM(tot)));
  // 3 stats row — white pill buttons style
  var statsRow=h("div",{style:{display:"flex",gap:"8px"}});
  [{v:fil.length,l:"Records"},{v:fil.filter(function(e){return e.screenshots&&e.screenshots.length}).length,l:"Receipts"},{v:S.expenses.length,l:"All Time"}].forEach(function(d){
    var pill=h("div",{style:{flex:"1",background:"rgba(255,255,255,.12)",borderRadius:"10px",padding:"10px 8px",textAlign:"center"}});
    pill.appendChild(h("div",{style:{fontSize:"18px",fontWeight:"700",color:C.white,letterSpacing:"-.5px"}},String(d.v)));
    pill.appendChild(h("div",{style:{fontSize:"10px",color:"rgba(255,255,255,.5)",marginTop:"2px",fontWeight:"500",letterSpacing:"-.1px"}},d.l));
    statsRow.appendChild(pill);
  });
  hero.appendChild(statsRow);
  w.appendChild(hero);

  // Search bar — like reference image
  var sr=h("div",{style:{padding:"14px 16px 0"}});
  var searchBox=h("div",{style:{display:"flex",alignItems:"center",background:C.white,border:"1.5px solid "+C.border,borderRadius:"12px",padding:"0 14px",gap:"10px"}});
  searchBox.appendChild(h("div",{style:{color:C.mutedLt,fontSize:"14px",flexShrink:"0",paddingTop:"1px"}},"○"));
  var si=h("input",{type:"text",placeholder:"Search expenses…",style:{flex:"1",background:"none",border:"none",outline:"none",fontSize:"14px",fontFamily:F,color:C.black,padding:"12px 0",fontWeight:"400",letterSpacing:"-.1px"}});
  si.value=S.search||"";si.addEventListener("input",function(){S.search=this.value;render()});
  searchBox.appendChild(si);
  sr.appendChild(searchBox);w.appendChild(sr);

  // Filter pills
  var fr=h("div",{style:{padding:"10px 16px 0",display:"flex",gap:"8px",overflowX:"auto",paddingBottom:"4px"}});
  [{k:"fm",opts:["All"].concat(MON),pl:"Month"},{k:"fc",opts:["All"].concat(S.categories),pl:"Category"},{k:"fp",opts:["All"].concat(PLATFORMS.slice(0,-1)),pl:"Platform"},{k:"fpy",opts:["All"].concat(PAYERS),pl:"Paid By"}].forEach(function(fd){
    var active=S[fd.k]!=="All";
    var sel=h("select",{style:{flexShrink:"0",background:active?C.black:C.white,border:"1px solid "+(active?C.black:C.border),color:active?C.white:C.muted,borderRadius:"20px",padding:"6px 12px",fontSize:"11px",fontWeight:"600",cursor:"pointer",fontFamily:F,maxWidth:"120px",letterSpacing:"-.1px"}});
    fd.opts.forEach(function(o){var op=h("option",{style:{background:C.white,color:C.black}},o);if(o===S[fd.k])op.selected=true;sel.appendChild(op)});
    sel.addEventListener("change",function(){var p={};p[fd.k]=this.value;set(p)});
    fr.appendChild(sel);
  });
  if(S.fm!=="All"||S.fc!=="All"||S.fp!=="All"||S.fpy!=="All"||S.search){
    fr.appendChild(h("button",{cls:"pressable",style:{flexShrink:"0",background:"#FFF0F0",border:"1px solid #FFCCCC",borderRadius:"20px",padding:"6px 12px",color:C.error,fontSize:"11px",fontWeight:"600",cursor:"pointer",fontFamily:F,whiteSpace:"nowrap"},onclick:function(){set({fm:"All",fc:"All",fp:"All",fpy:"All",search:""})}},"Clear"));
  }
  w.appendChild(fr);

  // Section header
  var txhdr=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 16px 10px"}});
  txhdr.appendChild(h("div",{style:{fontSize:"16px",fontWeight:"700",color:C.black,letterSpacing:"-.4px"}},"Recent Expenses"));
  txhdr.appendChild(h("div",{style:{fontSize:"13px",color:C.muted,fontWeight:"500"}},fil.length+" records"));
  w.appendChild(txhdr);

  if(!fil.length){
    var emp=h("div",{style:{textAlign:"center",padding:"52px 20px",background:C.white,margin:"0 16px",borderRadius:"16px",border:"1px solid "+C.border}});
    emp.appendChild(h("div",{style:{width:"40px",height:"40px",borderRadius:"10px",background:C.bg,margin:"0 auto 14px",display:"flex",alignItems:"center",justifyContent:"center"}}));
    emp.appendChild(h("div",{style:{fontSize:"15px",fontWeight:"600",color:C.black,letterSpacing:"-.3px"}},"No expenses found"));
    emp.appendChild(h("div",{style:{fontSize:"13px",color:C.muted,marginTop:"6px",letterSpacing:"-.1px"}},"Tap + to record your first expense"));
    w.appendChild(emp);
  } else {
    var list=h("div",{style:{display:"flex",flexDirection:"column",gap:"8px",padding:"0 16px"}});
    fil.slice(0,50).forEach(function(e){list.appendChild(buildCard(e))});
    w.appendChild(list);
  }
  return w;
}

function buildCard(e){
  var open=S.expandId===e.id;
  var catIdx=S.categories.indexOf(e.category);
  var shade=catIdx>=0?(255-Math.floor(catIdx/S.categories.length*120)):"200";
  var catColor=C.black;

  var card=h("div",{cls:"pressable",style:{background:C.white,borderRadius:"14px",overflow:"hidden",cursor:"pointer",border:"1px solid "+C.border,boxShadow:"0 1px 4px rgba(0,0,0,.04)"}});
  var top=h("div",{style:{padding:"14px 16px",display:"flex",alignItems:"center",gap:"12px"}});

  // category colour bar on left
  var bar=h("div",{style:{width:"3px",height:"40px",borderRadius:"2px",background:"hsl("+(catIdx*30%360)+",0%,"+(30+catIdx*5%50)+"%)",flexShrink:"0"}});
  top.appendChild(bar);

  var mid=h("div",{style:{flex:"1",minWidth:"0"}});
  mid.appendChild(h("div",{style:{fontWeight:"600",fontSize:"14px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:C.black,letterSpacing:"-.2px"}},e.description||""));
  var meta=h("div",{style:{fontSize:"12px",color:C.muted,marginTop:"3px",display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",letterSpacing:"-.1px"}});
  meta.appendChild(t(e.date||""));
  meta.appendChild(h("span",{style:{color:C.border}},"·"));
  meta.appendChild(t(e.platform||""));
  meta.appendChild(h("span",{style:{color:C.border}},"·"));
  meta.appendChild(h("span",{style:{fontWeight:"600",color:C.black}},e.paidBy||""));
  mid.appendChild(meta);
  mid.appendChild(h("div",{style:{display:"inline-block",marginTop:"6px",background:C.bg,border:"1px solid "+C.border,borderRadius:"5px",padding:"2px 8px",fontSize:"10px",fontWeight:"500",color:C.muted,letterSpacing:"-.1px"}},e.category||""));
  top.appendChild(mid);

  var rt=h("div",{style:{textAlign:"right",flexShrink:"0"}});
  rt.appendChild(h("div",{style:{fontWeight:"700",fontSize:"15px",color:C.black,letterSpacing:"-.4px"}},e.currency==="RMB (¥)"?fRMB(e.amount):fRM(e.amount)));

}

    topRow.appendChild(h("div",{style:{width:"8px",height:"8px",borderRadius:"50%",background:dotColor,flexShrink:"0",marginTop:"1px"}}));
    var info=h("div",{style:{flex:"1",minWidth:"0"}});
    info.appendChild(h("div",{style:{fontWeight:"600",fontSize:"14px",color:C.black,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",letterSpacing:"-.2px"}},c));
    info.appendChild(h("div",{style:{fontSize:"11px",color:C.muted,marginTop:"2px",letterSpacing:"-.1px"}},cnt+" record"+(cnt!==1?"s":"")+(total>0?"  ·  "+fRM(total):"")));
    topRow.appendChild(info);
    var btns=h("div",{style:{display:"flex",gap:"4px",flexShrink:"0"}});
    var eb=h("button",{cls:"pressable",style:{color:C.muted,background:"none",border:"none",cursor:"pointer",fontSize:"13px",padding:"4px 8px",fontFamily:F,fontWeight:"500"}},"Edit");
    eb.addEventListener("click",function(){var nv=prompt("Rename:",c);if(!nv||!nv.trim()||nv.trim()===c)return;var nv2=nv.trim();S.categories=S.categories.map(function(x){return x===c?nv2:x});S.expenses=S.expenses.map(function(e){return e.category===c?Object.assign({},e,{category:nv2}):e});sv("onle_cats",S.categories);sv("onle_expenses",S.expenses);render();toast("Updated")});
    var db=h("button",{cls:"pressable",style:{color:C.error,background:"none",border:"none",cursor:"pointer",fontSize:"13px",padding:"4px 8px",fontFamily:F,fontWeight:"500"}},"Remove");
    db.addEventListener("click",function(){if(confirm('Remove "'+c+'"?')){S.categories=S.categories.filter(function(x){return x!==c});sv("onle_cats",S.categories);render();toast("Removed")}});
    btns.appendChild(eb);btns.appendChild(db);topRow.appendChild(btns);
    card.appendChild(topRow);
    if(cnt>0){
      var barBg=h("div",{style:{height:"3px",background:C.border,borderRadius:"2px",overflow:"hidden"}});
      var barFill=h("div",{style:{height:"100%",borderRadius:"2px",background:dotColor,width:"0",transition:"width .5s ease"}});
      barBg.appendChild(barFill);card.appendChild(barBg);
      setTimeout(function(){barFill.style.width=Math.min(pct,100)+"%"},60);
    }
    list.appendChild(card);
  });
  w.appendChild(list);return w;
}

// ── EXPORT ───────────────────────────────────────────────────────
function buildExport(){
  var w=h("div",{cls:"page",style:{padding:"20px 16px"}});
  w.appendChild(h("div",{style:{fontSize:"24px",fontWeight:"700",letterSpacing:"-.6px",marginBottom:"6px"}},"Export Reports"));
  w.appendChild(h("div",{style:{fontSize:"13px",color:C.muted,marginBottom:"18px",letterSpacing:"-.1px"}},"Choose period then format"));

  var selRow=h("div",{style:{display:"flex",gap:"10px",marginBottom:"18px"}});
  var mSel=h("select",{style:Object.assign({},IS,{flex:"1"})});
  mSel.appendChild(h("option",{value:"All",style:{background:C.white}},"All Months"));
  MON.forEach(function(m,i){var o=h("option",{value:String(i),style:{background:C.white}},m);if(i===S.selM)o.selected=true;mSel.appendChild(o)});
  mSel.addEventListener("change",function(){S.selM=this.value==="All"?"All":parseInt(this.value);sv("onle_sm",S.selM);render()});
  var yrs=[new Date().getFullYear()];S.expenses.forEach(function(e){var y=parseInt((e.date||"").slice(0,4));if(y&&!yrs.includes(y))yrs.push(y)});yrs.sort(function(a,b){return b-a});
  var ySel=h("select",{style:Object.assign({},IS,{width:"90px"})});
  yrs.forEach(function(y){var o=h("option",{style:{background:C.white}},String(y));if(y===S.selY)o.selected=true;ySel.appendChild(o)});
  ySel.addEventListener("change",function(){S.selY=parseInt(this.value);sv("onle_sy",S.selY);render()});
  selRow.appendChild(mSel);selRow.appendChild(ySel);w.appendChild(selRow);

  var data=S.expenses.filter(function(e){
    if(S.selM!=="All"&&parseInt((e.date||"").split("-")[1])-1!==S.selM)return false;
    if(S.selY&&parseInt((e.date||"").slice(0,4))!==S.selY)return false;
    return true;
  });
  var totMYR=data.reduce(function(s,e){return s+gMYR(e)},0);

  // Stats — black card
  var prev=h("div",{style:{background:C.black,borderRadius:"16px",padding:"18px 20px",marginBottom:"20px",display:"flex",justifyContent:"space-around",alignItems:"center"}});
  function ms(v,l){var d=h("div",{style:{textAlign:"center"}});d.appendChild(h("div",{style:{fontSize:"20px",fontWeight:"700",color:C.white,letterSpacing:"-.5px"}},String(v)));d.appendChild(h("div",{style:{fontSize:"10px",color:"rgba(255,255,255,.5)",letterSpacing:"-.1px",marginTop:"3px",fontWeight:"500"}},l));return d}
  prev.appendChild(ms(data.length,"Records"));prev.appendChild(ms(fRM(totMYR),"Total MYR"));prev.appendChild(ms(data.filter(function(e){return e.screenshots&&e.screenshots.length}).length,"Receipts"));
  w.appendChild(prev);

  function exb(title,desc,accent,fn){
    var btn=h("button",{cls:"pressable",style:{background:accent?C.black:C.white,border:"1px solid "+(accent?C.black:C.border),borderRadius:"14px",padding:"16px 18px",display:"flex",alignItems:"center",gap:"14px",cursor:"pointer",textAlign:"left",fontFamily:F,width:"100%",marginBottom:"10px"}},null);
    var inf=h("div",{style:{flex:"1"}});
    inf.appendChild(h("div",{style:{fontWeight:"700",fontSize:"15px",color:accent?C.white:C.black,letterSpacing:"-.3px"}},title));
    inf.appendChild(h("div",{style:{fontSize:"12px",color:accent?"rgba(255,255,255,.6)":C.muted,marginTop:"3px",letterSpacing:"-.1px"}},desc));
    btn.appendChild(inf);
    btn.appendChild(h("div",{style:{color:accent?"rgba(255,255,255,.5)":C.muted,fontSize:"14px",fontWeight:"300"}},"→"));
    btn.addEventListener("click",fn);
    return btn;
  }
  var mLabel=S.selM==="All"?"All":MON[S.selM];
  w.appendChild(exb("CSV","Comma-separated data file",false,function(){doCSV(data,mLabel,S.selY)}));
  w.appendChild(exb("Excel (.xlsx)","Spreadsheet with all fields",false,function(){doXLSX(data,mLabel,S.selY)}));
  w.appendChild(exb("PDF Report","Formatted expense table",false,function(){doPDF(data,mLabel,S.selY)}));
  w.appendChild(exb("Receipt Album PDF","All receipts grouped by month",true,function(){doAlbum(data,mLabel,S.selY)}));
  return w;
}

function doCSV(data,m,y){var hdr=["Date","Description","Category","Platform","Currency","Amount","Amount MYR","Paid By","Notes"];var rows=data.map(function(e){return[e.date,'"'+(e.description||"")+'"','"'+(e.category||"")+'"',e.platform,e.currency,e.amount,e.amountMYR||e.amount,e.paidBy,'"'+(e.notes||"")+'"']});var txt=[hdr].concat(rows).map(function(r){return r.join(",")}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="Onle_"+m+"_"+y+".csv";a.click()}
function doXLSX(data,m,y){ldsc("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",function(){var X=window.XLSX;var rows=[["Onle Studio – Expense Report"],["Period: "+m+" "+y],[],["Date","Description","Category","Platform","Currency","Amount","MYR","Paid By","Notes"]].concat(data.map(function(e){return[e.date,e.description,e.category,e.platform,e.currency,e.amount,e.amountMYR||e.amount,e.paidBy,e.notes||""]})).concat([[],["Total MYR",data.reduce(function(s,e){return s+gMYR(e)},0).toFixed(2)]]);var ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=[12,30,22,14,10,12,14,12,30].map(function(w){return{wch:w}});var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,"Expenses");X.writeFile(wb,"Onle_"+m+"_"+y+".xlsx")})}
function doPDF(data,m,y){ldsc("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",function(){ldsc("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js",function(){var doc=new window.jspdf.jsPDF();doc.setFillColor(255,255,255);doc.rect(0,0,210,297,"F");doc.setFillColor(17,17,17);doc.rect(0,0,210,24,"F");doc.setTextColor(255,255,255);doc.setFontSize(13);doc.setFont("helvetica","bold");doc.text("ONLE STUDIO",14,11);doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(200,200,200);doc.text("Expense Report  ·  "+m+" "+y,14,18);doc.setTextColor(255,255,255);doc.text("Total: "+fRM(data.reduce(function(s,e){return s+gMYR(e)},0)),196,18,{align:"right"});doc.autoTable({startY:30,head:[["Date","Description","Category","Platform","Amount","Paid By"]],body:data.map(function(e){return[e.date,(e.description||"").substring(0,26),(e.category||"").split("(")[0].trim(),e.platform,e.currency==="RMB (¥)"?"¥"+e.amount+"≈RM"+(e.amountMYR||0):"RM"+Number(e.amount).toFixed(2),e.paidBy]}),styles:{fontSize:8,cellPadding:3,textColor:[17,17,17],fillColor:[255,255,255],lineColor:[235,235,235],lineWidth:.3},headStyles:{fillColor:[17,17,17],textColor:[255,255,255],fontStyle:"bold"},alternateRowStyles:{fillColor:[248,248,248]}});doc.save("Onle_"+m+"_"+y+".pdf")})})}
function doAlbum(data,m,y){var wr=data.filter(function(e){return e.screenshots&&e.screenshots.length});if(!wr.length){alert("No receipts in selected period.");return}ldsc("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",function(){var doc=new window.jspdf.jsPDF();doc.setFillColor(255,255,255);doc.rect(0,0,210,297,"F");doc.setFillColor(17,17,17);doc.rect(0,0,210,50,"F");doc.setTextColor(255,255,255);doc.setFontSize(22);doc.setFont("helvetica","bold");doc.text("ONLE STUDIO",14,22);doc.setFontSize(10);doc.setFont("helvetica","normal");doc.setTextColor(180,180,180);doc.text("Receipt Album  ·  "+m+" "+y+"  ·  "+wr.length+" receipts",14,34);var bm={};wr.forEach(function(e){var k=(e.date||"").slice(0,7)||"?";if(!bm[k])bm[k]=[];bm[k].push(e)});Object.keys(bm).sort().forEach(function(mo){doc.addPage();doc.setFillColor(248,248,248);doc.rect(0,0,210,14,"F");doc.setTextColor(17,17,17);doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text(mo,14,10);var yp=20;bm[mo].forEach(function(e){(e.screenshots||[]).forEach(function(s){if(yp>230){doc.addPage();yp=14}try{doc.addImage(s,s.indexOf("png")>=0?"PNG":"JPEG",14,yp,75,55)}catch(er){}doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(100,100,100);doc.text("Date: "+e.date,96,yp+8);doc.text("Amount: "+(e.currency==="RMB (¥)"?"¥"+e.amount+"≈RM"+(e.amountMYR||0):"RM"+Number(e.amount).toFixed(2)),96,yp+15);doc.text("Category: "+(e.category||""),96,yp+22);doc.text("Platform: "+(e.platform||""),96,yp+29);doc.text("Paid by: "+(e.paidBy||""),96,yp+36);if(e.notes)doc.text("Notes: "+(e.notes||"").substring(0,34),96,yp+43);doc.setDrawColor(235,235,235);doc.line(14,yp+60,196,yp+60);yp+=66})})});doc.save("Onle_ReceiptAlbum_"+m+"_"+y+".pdf")})}

function ldsc(src,cb){if(document.querySelector('script[src="'+src+'"]')){cb();return}var s=document.createElement("script");s.src=src;s.onload=cb;document.head.appendChild(s)}

render();
