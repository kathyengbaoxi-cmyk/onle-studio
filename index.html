function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function td(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pad(n){return String(n).padStart(2,"0")}

function fRMB(n){return"¥"+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function gMYR(e){return e.currency==="RMB (¥)"?(+e.amountMYR||0):(+e.amount||0)}
function ld(k,f){try{var v=localStorage.getItem(k);return v!=null?JSON.parse(v):f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function h(tag,props,kids){
  var e=document.createElement(tag);
  if(props)for(var k in props){
    if(k==="style"&&typeof props[k]==="object"){Object.assign(e.style,props[k])}
    else if(k==="cls"){e.className=props[k]}
    else if(k[0]==="o"&&k[1]==="n"){e.addEventListener(k.slice(2).toLowerCase(),props[k])}
    else e.setAttribute(k,props[k]);
  }
  if(kids!=null){var arr=Array.isArray(kids)?kids:[kids];arr.forEach(function(c){
    if(c==null||c===false||c===undefined)return;
    e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  })}
  return e;
}
function t(s){return document.createTextNode(String(s==null?"":s))}

function startListening(){
  expensesRef.on("value",function(snap){
    var data=snap.val();
    var list=[];
    if(data){Object.keys(data).forEach(function(k){list.push(Object.assign({},data[k],{id:k}))}); list.sort(function(a,b){return(b.date||"").localeCompare(a.date||"")})}
    S.expenses=list;S.syncing=false;S.online=true;render();
  },function(){S.syncing=false;S.online=false;render()});
}

function saveToFB(expense,cb){
  var id=expense.id||gid();
  var data=Object.assign({},expense);
  delete data.id;delete data.screenshots;delete data.categoryOther;
  expensesRef.child(id).set(data,function(err){
    if(err){toast("Save failed",true);return}
    if(expense.screenshots&&expense.screenshots.length){var shots=ld("onle_shots",{});shots[id]=expense.screenshots;sv("onle_shots",shots)}
    if(cb)cb(id);
  });
  return id;
}

function deleteFB(id){
  expensesRef.child(id).remove(function(err){if(err)toast("Delete failed",true)});
  var shots=ld("onle_shots",{});delete shots[id];sv("onle_shots",shots);
}

// ── PIN ──────────────────────────────────────────────────────────
function buildPinPad(onComplete,titleNode,subNode){
  var entered="";
  var wrap=h("div",{style:{minHeight:"100vh",background:C.white,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}});
  wrap.appendChild(titleNode);wrap.appendChild(subNode);
  var dots=h("div",{style:{display:"flex",justifyContent:"center",marginBottom:"36px"}});
  for(var i=0;i<4;i++)dots.appendChild(h("span",{cls:"pin-dot"}));
  wrap.appendChild(dots);
  var err=h("div",{style:{color:C.error,fontSize:"13px",fontWeight:"500",textAlign:"center",marginTop:"-24px",marginBottom:"18px",minHeight:"18px"}});
  wrap.appendChild(err);
  function upd(){dots.querySelectorAll(".pin-dot").forEach(function(d,i){i<entered.length?d.classList.add("filled"):d.classList.remove("filled")})}
  var grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:"14px",justifyContent:"center"}});
  [1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(function(n){
    var btn=h("button",{cls:"pin-btn"});
    btn.appendChild(h("span",{},String(n===""?" ":n)));
    var subs={2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"};
    if(subs[n])btn.appendChild(h("span",{cls:"pin-sub"},subs[n]));
    btn.addEventListener("click",function(){
      if(n==="⌫"){entered=entered.slice(0,-1);upd();err.textContent="";return}
      if(n==="")return;if(entered.length>=4)return;
      entered+=String(n);upd();
      if(entered.length===4)onComplete(entered,err,function(){entered="";upd()});
    });
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function getFiltered(){
  return S.expenses.filter(function(e){
    var m=parseInt((e.date||"").split("-")[1]);
    if(S.fm!=="All"&&(m-1)!==MON.indexOf(S.fm))return false;
    if(S.fc!=="All"&&e.category!==S.fc)return false;
    if(S.fp!=="All"&&e.platform!==S.fp)return false;
    if(S.fpy!=="All"&&e.paidBy!==S.fpy)return false;
    if(S.search&&(e.description||"").toLowerCase().indexOf(S.search.toLowerCase())<0&&(e.notes||"").toLowerCase().indexOf(S.search.toLowerCase())<0)return false;
    return true;
  });
}

    var tr=h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:cnt>0?"10px":"0"}});
    var inf=h("div",{style:{flex:"1",minWidth:"0"}});
    inf.appendChild(h("div",{style:{fontWeight:"600",fontSize:"14px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",letterSpacing:"-.2px"}},c));
    inf.appendChild(h("div",{style:{fontSize:"11px",color:C.muted,marginTop:"2px"}},cnt+" record"+(cnt!==1?"s":"")+(tot>0?"  ·  "+fRM(tot):"")));
    tr.appendChild(inf);
    var btns=h("div",{style:{display:"flex",gap:"4px",flexShrink:"0"}});
    var eb=h("button",{cls:"pressable",style:{color:C.muted,background:"none",border:"none",cursor:"pointer",fontSize:"13px",padding:"4px 8px",fontFamily:F,fontWeight:"500"}},"Edit");
    eb.addEventListener("click",function(){var nv=prompt("Rename:",c);if(!nv||!nv.trim()||nv.trim()===c)return;var nv2=nv.trim();S.categories=S.categories.map(function(x){return x===c?nv2:x});sv("onle_cats",S.categories);render();toast("Updated")});
    var db=h("button",{cls:"pressable",style:{color:C.error,background:"none",border:"none",cursor:"pointer",fontSize:"13px",padding:"4px 8px",fontFamily:F,fontWeight:"500"}},"Remove");
    db.addEventListener("click",function(){if(confirm('Remove "'+c+'"?')){S.categories=S.categories.filter(function(x){return x!==c});sv("onle_cats",S.categories);render();toast("Removed")}});
    btns.appendChild(eb);btns.appendChild(db);tr.appendChild(btns);card.appendChild(tr);
    if(cnt>0){var bb=h("div",{style:{height:"3px",background:C.border,borderRadius:"2px",overflow:"hidden"}});var bf=h("div",{style:{height:"100%",borderRadius:"2px",background:dotColor,width:"0",transition:"width .5s ease"}});bb.appendChild(bf);card.appendChild(bb);setTimeout(function(){bf.style.width=Math.min(pct,100)+"%"},60)}
    list.appendChild(card);
  });
  w.appendChild(list);return w;
}

// ── EXPORT ───────────────────────────────────────────────────────
function buildExport(){
  var w=h("div",{cls:"page",style:{padding:"20px 16px"}});
  w.appendChild(h("div",{style:{fontSize:"24px",fontWeight:"700",letterSpacing:"-.6px",marginBottom:"6px"}},"Export Reports"));
  w.appendChild(h("div",{style:{fontSize:"13px",color:C.muted,marginBottom:"18px"}},"Choose period then format"));
  var selRow=h("div",{style:{display:"flex",gap:"10px",marginBottom:"18px"}});
  var mSel=h("select",{style:Object.assign({},IS,{flex:"1"})});
  mSel.appendChild(h("option",{value:"All",style:{background:C.white}},"All Months"));
  MON.forEach(function(m,i){var o=h("option",{value:String(i),style:{background:C.white}},m);if(i===S.selM)o.selected=true;mSel.appendChild(o)});
  mSel.addEventListener("change",function(){S.selM=this.value==="All"?"All":parseInt(this.value);sv("onle_sm",S.selM);render()});
  var yrs=[new Date().getFullYear()];S.expenses.forEach(function(e){var y=parseInt((e.date||"").slice(0,4));if(y&&!yrs.includes(y))yrs.push(y)});yrs.sort(function(a,b){return b-a});
  var ySel=h("select",{style:Object.assign({},IS,{width:"90px"})});
  yrs.forEach(function(y){var o=h("option",{style:{background:C.white}},String(y));if(y===S.selY)o.selected=true;ySel.appendChild(o)});
  ySel.addEventListener("change",function(){S.selY=parseInt(this.value);sv("onle_sy",S.selY);render()});
  selRow.appendChild(mSel);selRow.appendChild(ySel);w.appendChild(selRow);
  var data=S.expenses.filter(function(e){if(S.selM!=="All"&&parseInt((e.date||"").split("-")[1])-1!==S.selM)return false;if(S.selY&&parseInt((e.date||"").slice(0,4))!==S.selY)return false;return true});
  var totMYR=data.reduce(function(s,e){return s+gMYR(e)},0);
  var prev=h("div",{style:{background:C.black,borderRadius:"16px",padding:"16px 20px",marginBottom:"20px",display:"flex",justifyContent:"space-around",alignItems:"center"}});
  function ms(v,l){var d=h("div",{style:{textAlign:"center"}});d.appendChild(h("div",{style:{fontSize:"20px",fontWeight:"700",color:C.white,letterSpacing:"-.5px"}},String(v)));d.appendChild(h("div",{style:{fontSize:"10px",color:"rgba(255,255,255,.5)",letterSpacing:"-.1px",marginTop:"3px",fontWeight:"500"}},l));return d}
  prev.appendChild(ms(data.length,"Records"));prev.appendChild(ms(fRM(totMYR),"Total MYR"));prev.appendChild(ms(data.filter(function(e){return getShots(e.id).length>0}).length,"Receipts"));
  w.appendChild(prev);
  function exb(title,desc,accent,fn){var btn=h("button",{cls:"pressable",style:{background:accent?C.black:C.white,border:"1px solid "+(accent?C.black:C.border),borderRadius:"14px",padding:"16px 18px",display:"flex",alignItems:"center",gap:"14px",cursor:"pointer",textAlign:"left",fontFamily:F,width:"100%",marginBottom:"10px"}},null);var inf=h("div",{style:{flex:"1"}});inf.appendChild(h("div",{style:{fontWeight:"700",fontSize:"15px",color:accent?C.white:C.black,letterSpacing:"-.3px"}},title));inf.appendChild(h("div",{style:{fontSize:"12px",color:accent?"rgba(255,255,255,.6)":C.muted,marginTop:"3px"}},desc));btn.appendChild(inf);btn.appendChild(h("div",{style:{color:accent?"rgba(255,255,255,.5)":C.muted,fontSize:"14px"}},"→"));btn.addEventListener("click",fn);return btn}
  var mLabel=S.selM==="All"?"All":MON[S.selM];
  w.appendChild(exb("CSV","Comma-separated data file",false,function(){doCSV(data,mLabel,S.selY)}));
  w.appendChild(exb("Excel (.xlsx)","Spreadsheet with all fields",false,function(){doXLSX(data,mLabel,S.selY)}));
  w.appendChild(exb("PDF Report","Formatted expense table",false,function(){doPDF(data,mLabel,S.selY)}));
  w.appendChild(exb("Receipt Album PDF","All receipts grouped by month",true,function(){doAlbum(data,mLabel,S.selY)}));
  return w;
}

function doCSV(data,m,y){var hdr=["Date","Description","Category","Platform","Currency","Amount","Amount MYR","Paid By","Notes"];var rows=data.map(function(e){return[e.date,'"'+(e.description||"")+'"','"'+(e.category||"")+'"',e.platform,e.currency,e.amount,e.amountMYR||e.amount,e.paidBy,'"'+(e.notes||"")+'"']});var txt=[hdr].concat(rows).map(function(r){return r.join(",")}).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="Onle_"+m+"_"+y+".csv";a.click()}
function doXLSX(data,m,y){ldsc("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",function(){var X=window.XLSX;var rows=[["Onle Studio – Expense Report"],["Period: "+m+" "+y],[],["Date","Description","Category","Platform","Currency","Amount","MYR","Paid By","Notes"]].concat(data.map(function(e){return[e.date,e.description,e.category,e.platform,e.currency,e.amount,e.amountMYR||e.amount,e.paidBy,e.notes||""]})).concat([[],["Total MYR",data.reduce(function(s,e){return s+gMYR(e)},0).toFixed(2)]]);var ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=[12,30,22,14,10,12,14,12,30].map(function(w){return{wch:w}});var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,"Expenses");X.writeFile(wb,"Onle_"+m+"_"+y+".xlsx")})}
function doPDF(data,m,y){ldsc("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",function(){ldsc("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js",function(){var doc=new window.jspdf.jsPDF();doc.setFillColor(17,17,17);doc.rect(0,0,210,24,"F");doc.setTextColor(255,255,255);doc.setFontSize(14);doc.setFont("helvetica","bold");doc.text("ONLE STUDIO",14,11);doc.setFontSize(9);doc.setFont("helvetica","normal");doc.setTextColor(200,200,200);doc.text("Expense Report · "+m+" "+y+"  ·  Total: "+fRM(data.reduce(function(s,e){return s+gMYR(e)},0)),14,19);doc.autoTable({startY:28,head:[["Date","Description","Category","Platform","Amount","Paid By"]],body:data.map(function(e){return[e.date,(e.description||"").substring(0,26),(e.category||"").split("(")[0].trim(),e.platform,e.currency==="RMB (¥)"?"¥"+e.amount+"≈RM"+(e.amountMYR||0):"RM"+Number(e.amount).toFixed(2),e.paidBy]}),styles:{fontSize:8,cellPadding:3,textColor:[17,17,17],fillColor:[255,255,255],lineColor:[235,235,235],lineWidth:.3},headStyles:{fillColor:[17,17,17],textColor:[255,255,255],fontStyle:"bold"},alternateRowStyles:{fillColor:[248,248,248]}});doc.save("Onle_"+m+"_"+y+".pdf")})})}
function doAlbum(data,m,y){var wr=data.filter(function(e){return getShots(e.id).length>0});if(!wr.length){alert("No receipts in selected period.");return}ldsc("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",function(){var doc=new window.jspdf.jsPDF();doc.setFillColor(255,255,255);doc.rect(0,0,210,297,"F");doc.setFillColor(17,17,17);doc.rect(0,0,210,50,"F");doc.setTextColor(255,255,255);doc.setFontSize(22);doc.setFont("helvetica","bold");doc.text("ONLE STUDIO",14,22);doc.setFontSize(10);doc.setFont("helvetica","normal");doc.setTextColor(180,180,180);doc.text("Receipt Album  ·  "+m+" "+y+"  ·  "+wr.length+" receipts",14,34);var bm={};wr.forEach(function(e){var k=(e.date||"").slice(0,7)||"?";if(!bm[k])bm[k]=[];bm[k].push(e)});Object.keys(bm).sort().forEach(function(mo){doc.addPage();doc.setFillColor(248,248,248);doc.rect(0,0,210,14,"F");doc.setTextColor(17,17,17);doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text(mo,14,10);var yp=20;bm[mo].forEach(function(e){getShots(e.id).forEach(function(s){if(yp>230){doc.addPage();yp=14}try{doc.addImage(s,s.indexOf("png")>=0?"PNG":"JPEG",14,yp,75,55)}catch(er){}doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(100,100,100);doc.text("Date: "+e.date,96,yp+8);doc.text("Amount: "+(e.currency==="RMB (¥)"?"¥"+e.amount+"≈RM"+(e.amountMYR||0):"RM"+Number(e.amount).toFixed(2)),96,yp+15);doc.text("Category: "+(e.category||""),96,yp+22);doc.text("Platform: "+(e.platform||""),96,yp+29);doc.text("Paid by: "+(e.paidBy||""),96,yp+36);if(e.notes)doc.text("Notes: "+(e.notes||"").substring(0,34),96,yp+43);doc.setDrawColor(235,235,235);doc.line(14,yp+60,196,yp+60);yp+=66})})});doc.save("Onle_ReceiptAlbum_"+m+"_"+y+".pdf")})}
function ldsc(src,cb){if(document.querySelector('script[src="'+src+'"]')){cb();return}var s=document.createElement("script");s.src=src;s.onload=cb;document.head.appendChild(s)}

render();
</script>
